<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPG Studio</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:265}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{--h:265;margin:0;min-height:100vh;color:#eef0ff;background:#07070f;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;transition:--h 1s ease;
--ac:hsl(var(--h) 95% 62%);--ac2:hsl(calc(var(--h) + 50) 95% 60%);--glow:hsl(var(--h) 95% 55% / .35)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 15% 10%,hsl(var(--h) 90% 30% / .55),transparent),radial-gradient(50% 50% at 90% 90%,hsl(calc(var(--h) + 60) 90% 28% / .5),transparent)}
#fx{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
main{max-width:1040px;margin:0 auto;padding:22px 16px 50px}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid #ffffff22;color:#9aa0c8;transition:.5s}
.chip.on{color:#fff;border-color:var(--ac);box-shadow:0 0 18px var(--glow);background:#ffffff0d}
h1{font-size:clamp(30px,6vw,56px);margin:14px 0 4px;letter-spacing:-1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;min-height:1.2em;font-variant-numeric:tabular-nums}
.sub{color:#aab0d8;margin:0 0 22px;min-height:1.5em}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#ffffff0c;border:1px solid #ffffff1c;border-radius:18px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 40px -12px var(--glow);transition:box-shadow 1s}
.card h2{font-size:15px;margin:0 0 12px;letter-spacing:.12em;text-transform:uppercase;color:#c9cdf5}
#drop{border:2px dashed #ffffff40;border-radius:14px;padding:26px 12px;text-align:center;cursor:pointer;transition:.3s;color:#c9cdf5}
#drop:hover,#drop.over{border-color:var(--ac);background:#ffffff0d;box-shadow:inset 0 0 30px var(--glow)}
#drop b{display:block;font-size:30px;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
#info{font-size:13px;color:#aab0d8;margin-top:10px;min-height:18px}
#err{color:#ff8a8a;font-size:13px;margin-top:6px}
button.go{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:700;color:#07070f;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 0 24px var(--glow);transition:.3s}
button.go:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.lb{margin-top:16px;display:grid;gap:10px}
.row{font-size:13px}
.row .t{display:flex;justify-content:space-between;margin-bottom:4px;color:#d7dafc}
.bar{height:9px;border-radius:9px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.row.run .bar i{background-size:200% 100%;background-image:repeating-linear-gradient(45deg,var(--ac) 0 8px,var(--ac2) 8px 16px);animation:mv .6s linear infinite}
@keyframes mv{to{background-position:32px 0}}
.row.win .t{color:#fff;font-weight:700;text-shadow:0 0 12px var(--ac)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.4}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media(max-width:480px){.f{grid-template-columns:1fr}}
label{font-size:12px;color:#aab0d8;display:block}
label small{opacity:.7}
input,select{width:100%;margin-top:4px;padding:10px 12px;font:inherit;font-size:16px;color:#fff;background:#0b0b1c99;border:1px solid #ffffff2a;border-radius:10px;outline:0;transition:.25s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
select option{color:#000}
.gauge{position:relative;max-width:340px;margin:10px auto 0}
.gauge svg{width:100%;display:block;overflow:visible}
.gauge .arc{fill:none;stroke-width:14;stroke-linecap:round}
#fill{stroke:url(#gg);stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px var(--ac))}
.read{position:absolute;left:0;right:0;bottom:2px;text-align:center}
#num{font-size:clamp(40px,9vw,60px);font-weight:800;line-height:1}
.read span{display:block;font-size:12px;color:#aab0d8;letter-spacing:.14em}
#tag{text-align:center;margin-top:10px;font-weight:700;color:var(--ac);min-height:24px}
#hint{font-size:12px;color:#8e94c0;text-align:center;margin-top:4px;min-height:16px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
<div class="steps"><span class="chip on" id="s1">1 · Upload</span><span class="chip" id="s2">2 · Train</span><span class="chip" id="s3">3 · Predict</span></div>
<h1 id="title">MPG Studio</h1>
<p class="sub" id="sub">Bundled dataset loads automatically — or drop in your own auto-mpg.csv to retrain.</p>
<div class="grid">
<div>
<div class="card">
<h2>Dataset</h2>
<div id="drop"><b>⛽</b>Drag & drop auto-mpg.csv<br><small>or tap to browse</small></div>
<input id="file" type="file" accept=".csv,text/csv" hidden>
<div id="info"></div><div id="err"></div>
<button class="go" id="train" disabled>Train &amp; compare models</button>
<div class="lb" id="lb"></div>
</div>
</div>
<div class="card">
<h2>Live prediction</h2>
<fieldset id="form" disabled>
<div class="f">
<label>Cylinders<input id="cylinders" type="number" step="any" inputmode="decimal"></label>
<label>Engine displacement <small>(cu. in.)</small><input id="displacement" type="number" step="any" inputmode="decimal"></label>
<label>Horsepower <small>(blank = auto-fill)</small><input id="horsepower" type="number" step="any" inputmode="decimal"></label>
<label>Weight <small>(lbs)</small><input id="weight" type="number" step="any" inputmode="decimal"></label>
<label>Acceleration <small>(sec)</small><input id="acceleration" type="number" step="any" inputmode="decimal"></label>
<label>Model year <small>(e.g. 76)</small><input id="model_year" type="number" step="any" inputmode="decimal"></label>
<label style="grid-column:1/-1">Origin<select id="origin"><option value="1">USA</option><option value="2">Europe</option><option value="3">Japan</option></select></label>
</div>
</fieldset>
<div class="gauge">
<svg viewBox="0 0 200 112"><defs><linearGradient id="gg"><stop offset="0" stop-color="#ff5b3a"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#2dffb0"/></linearGradient></defs>
<path class="arc" stroke="#ffffff18" d="M20 100 A80 80 0 0 1 180 100"/>
<path class="arc" id="fill" d="M20 100 A80 80 0 0 1 180 100"/></svg>
<div class="read"><div id="num">--</div><span>MILES PER GALLON</span></div>
</div>
<div id="tag"></div><div id="hint"></div>
</div>
</div>
</main>
<script>
const $=s=>document.getElementById(s);
const NUM=['cylinders','displacement','horsepower','weight','acceleration','model_year'];
let rows=[],y=[],model=null,best='',stats={};

/* ---------- ML-START ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function parseCSV(t){const o=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);o.push(r);r=[];f=''}else f+=c}
if(f!==''||r.length){r.push(f);o.push(r)}return o.filter(r=>r.length>1)}
function fitPrep(X){const med=[],mu=[],sd=[];
for(let j=0;j<6;j++){const v=X.map(r=>r[j]).filter(Number.isFinite).sort((a,b)=>a-b);const n=v.length||1;
med.push(v.length?v[v.length>>1]:0);const m=v.reduce((s,x)=>s+x,0)/n;mu.push(m);
sd.push(Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/n)||1)}
return r=>{const o=[];for(let j=0;j<6;j++){const x=Number.isFinite(r[j])?r[j]:med[j];o.push((x-mu[j])/sd[j])}
for(let k=1;k<=3;k++)o.push(r[6]===k?1:0);return o}}
function fitRidge(F,y,lam=1){const n=F.length,p=F[0].length+1;const A=Array.from({length:p},()=>new Array(p+1).fill(0));
for(let i=0;i<n;i++){const x=[1,...F[i]];for(let a=0;a<p;a++){for(let b=0;b<p;b++)A[a][b]+=x[a]*x[b];A[a][p]+=x[a]*y[i]}}
for(let a=1;a<p;a++)A[a][a]+=lam;
for(let c=0;c<p;c++){let m=c;for(let r=c+1;r<p;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];
for(let r=0;r<p;r++)if(r!=c){const f=A[r][c]/A[c][c];for(let k=c;k<=p;k++)A[r][k]-=f*A[c][k]}}
const w=A.map((r,i)=>r[p]/r[i]);return x=>w[0]+x.reduce((s,v,i)=>s+v*w[i+1],0)}
function fitKNN(F,y,k=5){return x=>{const d=F.map((f,i)=>[f.reduce((s,v,j)=>s+(v-x[j])**2,0),i]).sort((a,b)=>a[0]-b[0]).slice(0,k);
return d.reduce((s,e)=>s+y[e[1]],0)/d.length}}
function tree(F,y,idx,dep,maxD,minL,nf,rnd){const n=idx.length;let sum=0;for(const i of idx)sum+=y[i];const mean=sum/n;
if(dep>=maxD||n<2*minL)return{v:mean};
let fs=F[0].map((_,j)=>j);if(nf){fs=fs.sort(()=>rnd()-.5).slice(0,nf)}
let best=null,bs=-Infinity;
for(const j of fs){const s=idx.slice().sort((a,b)=>F[a][j]-F[b][j]);let ls=0;
for(let t=0;t<n-1;t++){ls+=y[s[t]];const nl=t+1,nr=n-nl;
if(nl<minL||nr<minL||F[s[t]][j]===F[s[t+1]][j])continue;
const rs=sum-ls,sc=ls*ls/nl+rs*rs/nr;if(sc>bs){bs=sc;best={j,th:(F[s[t]][j]+F[s[t+1]][j])/2}}}}
if(!best)return{v:mean};
const L=[],R=[];for(const i of idx)(F[i][best.j]<=best.th?L:R).push(i);
return{j:best.j,th:best.th,l:tree(F,y,L,dep+1,maxD,minL,nf,rnd),r:tree(F,y,R,dep+1,maxD,minL,nf,rnd)}}
const pt=(t,x)=>{while(t.l)t=x[t.j]<=t.th?t.l:t.r;return t.v};
function fitRF(F,y,rnd,T=50){const n=F.length,ts=[];
for(let t=0;t<T;t++){const idx=Array.from({length:n},()=>rnd()*n|0);ts.push(tree(F,y,idx,0,9,2,3,rnd))}
return x=>ts.reduce((s,t)=>s+pt(t,x),0)/T}
function fitGB(F,y,rnd,T=100,lr=.1){const n=F.length,m0=y.reduce((a,b)=>a+b,0)/n,p=new Array(n).fill(m0),ts=[],all=[...Array(n).keys()];
for(let t=0;t<T;t++){const res=y.map((v,i)=>v-p[i]);const tr=tree(F,res,all,0,3,3,0,rnd);ts.push(tr);for(let i=0;i<n;i++)p[i]+=lr*pt(tr,F[i])}
return x=>m0+lr*ts.reduce((s,t)=>s+pt(t,x),0)}
const ALGOS={'Ridge Regression':(F,y)=>fitRidge(F,y),'k-Nearest Neighbors':(F,y)=>fitKNN(F,y),'Random Forest':fitRF,'Gradient Boosting':fitGB};
function fit(name,X,y,rnd){const prep=fitPrep(X),m=ALGOS[name](X.map(prep),y,rnd);return r=>m(prep(r))}
function metrics(a,p){const n=a.length,mu=a.reduce((s,x)=>s+x,0)/n;let se=0,ae=0,st=0;
for(let i=0;i<n;i++){const e=a[i]-p[i];se+=e*e;ae+=Math.abs(e);st+=(a[i]-mu)**2}
return{rmse:Math.sqrt(se/n),mae:ae/n,r2:1-se/st}}
/* ---------- ML-END ---------- */

/* ---------- UI ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let hue=265,spd=1;
function mood(h,s,ch){document.body.style.setProperty('--h',h);spd=s;if(ch)setChip(ch)}
function setChip(n){[1,2,3].forEach(i=>$('s'+i).classList.toggle('on',i<=n))}
function scramble(el,text){const ch='▮▯░▒▓#$%&*+=?',t0=performance.now();clearInterval(el._t);
el._t=setInterval(()=>{const p=(performance.now()-t0)/650;
el.textContent=[...text].map((c,i)=>c===' '||i<p*text.length?c:ch[Math.random()*ch.length|0]).join('');
if(p>=1){el.textContent=text;clearInterval(el._t)}},35)}
function head(t,s){scramble($('title'),t);$('sub').textContent=s}

async function load(file){ingest(await file.text(),file.name)}
function ingest(text,name){
$('err').textContent='';
try{const t=parseCSV(text);
const h=t[0].map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_'));
const need=['mpg',...NUM,'origin'],ix=need.map(c=>h.indexOf(c));
if(ix.includes(-1))throw new Error('Missing column(s): '+need.filter((c,i)=>ix[i]<0).join(', '));
rows=[];y=[];let miss=0;
for(const r of t.slice(1)){const v=ix.map(i=>parseFloat(r[i]));
if(!Number.isFinite(v[0])||![1,2,3].includes(v[7]))continue;
if(!Number.isFinite(v[3]))miss++;
y.push(v[0]);rows.push([...v.slice(1,7),v[7]])}
if(rows.length<30)throw new Error('Need at least 30 valid rows.');
stats={};NUM.forEach((c,j)=>{const a=rows.map(r=>r[j]).filter(Number.isFinite).sort((p,q)=>p-q);stats[c]={min:a[0],max:a[a.length-1],med:a[a.length>>1]}});
$('info').textContent=`✔ ${name}: ${rows.length} cars · ${miss} missing horsepower value(s) will be auto-filled`;
$('train').disabled=false;$('lb').innerHTML='';model=null;$('form').disabled=true;
mood(200,1.6,1);head('Dataset locked in','Now hit “Train & compare models”.')
}catch(e){$('err').textContent=e.message;$('train').disabled=true}}

async function train(){
$('train').disabled=true;mood(190,5,2);head('Racing 4 models…','Cross-validating and tuning each one on your data.');
const rnd=rng(42),n=rows.length,ord=[...Array(n).keys()].sort(()=>rnd()-.5),nt=Math.round(n*.2),te=ord.slice(0,nt),tr=ord.slice(nt);
const names=Object.keys(ALGOS);$('lb').innerHTML=names.map((m,i)=>`<div class="row run" id="r${i}"><div class="t"><span>${m}</span><span id="v${i}">training…</span></div><div class="bar"><i id="b${i}"></i></div></div>`).join('');
const res=[];
for(let a=0;a<names.length;a++){const nm=names[a],ap=[],pp=[];
for(let f=0;f<5;f++){$('b'+a).style.width=(f+1)*16+'%';await sleep(20);
const va=tr.filter((_,i)=>i%5===f),tn=tr.filter((_,i)=>i%5!==f);
const m=fit(nm,tn.map(i=>rows[i]),tn.map(i=>y[i]),rnd);va.forEach(i=>{ap.push(y[i]);pp.push(m(rows[i]))})}
const cv=metrics(ap,pp).rmse;
const m=fit(nm,tr.map(i=>rows[i]),tr.map(i=>y[i]),rnd),tm=metrics(te.map(i=>y[i]),te.map(i=>m(rows[i])));
res.push({nm,cv,...tm});$('b'+a).style.width='100%';await sleep(20)}
res.sort((p,q)=>p.cv-q.cv);best=res[0].nm;
$('lb').innerHTML=res.map((r,i)=>`<div class="row ${i?'':'win'}"><div class="t"><span>${i?'':'👑 '}${r.nm}</span><span>CV RMSE ${r.cv.toFixed(2)} · R² ${r.r2.toFixed(3)}</span></div><div class="bar"><i style="width:${(res[0].cv/r.cv*100).toFixed(0)}%"></i></div></div>`).join('');
model=fit(best,rows,y,rnd);
NUM.forEach(c=>{const e=$(c);e.placeholder=stats[c].med;e.value=stats[c].med});
$('form').disabled=false;$('train').disabled=false;burst();
mood(150,2,3);head(best+' takes the crown','Type any value below — the gauge reacts instantly.');predict()}

let shown=0;
function predict(){if(!model)return;
const r=NUM.map(c=>{const v=parseFloat($(c).value);return Number.isFinite(v)?v:NaN});r.push(+$('origin').value);
const mpg=Math.max(4,Math.min(55,model(r)));
$('fill').style.strokeDashoffset=251.3*(1-Math.min(mpg,50)/50);
const from=shown,t0=performance.now();shown=mpg;
(function tick(){const p=Math.min(1,(performance.now()-t0)/700);$('num').textContent=(from+(mpg-from)*(1-(1-p)**3)).toFixed(1);if(p<1)requestAnimationFrame(tick)})();
const kml=mpg*0.4251;let m,h,s,tt;
if(mpg<18){m='thirsty';h=12;s=7;tt='Thirsty beast'}else if(mpg<27){m='balanced';h=45;s=3;tt='Balanced cruiser'}else{m='eco';h=160;s=1.4;tt='Eco champion'}
if(m!==predict.m){predict.m=m;mood(h,s,3);scramble($('title'),tt)}
$('tag').textContent=`≈ ${kml.toFixed(1)} km/L`;
$('hint').textContent=Number.isFinite(r[2])?'':'Horsepower left blank → filled with the dataset median.'}

/* ---------- effects ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
for(let i=0;i<70;i++)P.push({x:Math.random()*2000,y:Math.random()*1200,l:10+Math.random()*50,v:.4+Math.random()*1.2,a:.15+Math.random()*.4});
let bursts=[];function burst(){for(let i=0;i<60;i++){const a=Math.random()*6.28,v=2+Math.random()*6;bursts.push({x:W/2,y:H/3,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1})}}
function frame(){cx.clearRect(0,0,W,H);const hh=parseFloat(getComputedStyle(document.body).getPropertyValue('--h'))||265;
cx.lineCap='round';for(const p of P){p.x-=p.v*spd*3;if(p.x+p.l<0){p.x=W+Math.random()*100;p.y=Math.random()*H}
cx.strokeStyle=`hsla(${hh},95%,65%,${p.a})`;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+p.l*Math.min(spd,4),p.y);cx.stroke()}
bursts=bursts.filter(b=>b.life>0);for(const b of bursts){b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.life-=.016;cx.fillStyle=`hsla(${hh+Math.random()*60},95%,65%,${b.life})`;cx.fillRect(b.x,b.y,4,4)}
requestAnimationFrame(frame)}frame();

/* ---------- wiring ---------- */
const dz=$('drop');dz.onclick=()=>$('file').click();
$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>e.dataTransfer.files[0]&&load(e.dataTransfer.files[0]));
$('train').onclick=train;
